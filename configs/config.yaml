# Root config. Shared sizes live here and are interpolated by the model
# config, as in le-wm. Override from code with
# load_config(["embed_dim=256", "model.predictor.depth=4"]).
defaults:
  - _self_
  - model: lewm

embed_dim: 192
# Context steps the predictor attends over (WindowConfig.max_context_steps).
history_size: 50
