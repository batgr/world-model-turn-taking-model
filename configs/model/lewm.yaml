# The frozen audio encoder is a config group: model/encoder=mimi (default) or
# logmel; each sets `model.encoder` and the root `feature_dim` the projector takes.
defaults:
  - encoder: mimi
  - _self_

_target_: turn_wm.models.lewm.jepa.JEPA

predictor:
  _target_: turn_wm.models.lewm.predictor.ARPredictor
  # Kept for the learned-position reproduction variant; RoPE itself has no
  # learned maximum sequence length.
  num_frames: ${data.context_steps}
  position_encoding: rope
  rope_base: 10000.0
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  output_dim: ${embed_dim}
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

action_encoder:
  _target_: turn_wm.models.lewm.embedder.Embedder
  num_actions: 6
  smoothed_dim: 10
  emb_dim: ${embed_dim}
  padding_idx: 5

projector:
  _target_: turn_wm.models.lewm.mlp.MLP
  input_dim: ${feature_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  # Normalize across examples at each time step without mixing future positions.
  norm_fn:
    _target_: turn_wm.models.lewm.mlp.make_norm
    _partial_: true
    kind: causal_batch_norm
    num_positions: null

pred_proj:
  _target_: turn_wm.models.lewm.mlp.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  # Training normalizes each causal predictor position independently. Keep
  # matching running statistics per position at evaluation: RoPE removes the
  # learned absolute embedding, but causal receptive fields still differ by
  # position.
  norm_fn:
    _target_: turn_wm.models.lewm.mlp.make_norm
    _partial_: true
    kind: causal_batch_norm
    num_positions: ${model.predictor.num_frames}
