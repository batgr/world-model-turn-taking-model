# Retain the V1 model configuration; change only the two projectors.
defaults:
  - lewm
  - _self_

projector:
  norm_fn:
    _target_: hydra.utils.get_class
    path: turn_wm.models.lewm.mlp.CausalBatchNorm1d

pred_proj:
  # Per-position statistics: the predictor output depends on its absolute
  # position embedding, so evaluation must normalize each position as
  # training does.
  norm_fn:
    _target_: turn_wm.models.lewm.mlp.CausalBatchNorm1d
    _partial_: true
    num_positions: ${model.predictor.num_frames}
