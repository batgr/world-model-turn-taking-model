# Projector-normalization ablation: use LayerNorm in both projectors under the current predictor.
defaults:
  - lewm
  - _self_

projector:
  norm_fn:
    _target_: hydra.utils.get_class
    path: torch.nn.LayerNorm

pred_proj:
  norm_fn:
    _target_: hydra.utils.get_class
    path: torch.nn.LayerNorm
