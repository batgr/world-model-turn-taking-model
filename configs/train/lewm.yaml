# @package _global_
# Training recipe; its keys sit at the root of the composed config, next to
# `model` and `embed_dim` (see config.yaml). Read by turn_wm.training.lewm.

# Seeds Python, NumPy, PyTorch and data loader workers (training.train.run,
# before the model is built) and the data loader order.
seed: 3072

data:
  # A name in turn_wm.data.source.DATASETS: egocom (public), ego4d, full.
  dataset: full

  # Rate of the dataset's decision grid (its metadata grid.frequency_hz);
  # checked against the loaded data. Every *_steps below counts grid steps.
  grid_rate_hz: 10.0

  # Where audio observations come from:
  #   feature_cache: features of model/encoder precomputed by
  #                  `turn-wm precompute-features` under feature_cache.root;
  #                  no raw audio, the encoder is never loaded.
  #   raw_audio:     decoded from local media (<DATASET>_MEDIA_ROOT) and encoded
  #                  by the frozen encoder at every step; for debugging.
  # Both feed the same `feature_dim` features to the same projector.
  observation_source: feature_cache
  feature_cache:
    # Required with observation_source: feature_cache.
    root: null
  # Ground-truth context: the teacher forcing predicts z1..zC from z0..z(C-1).
  # Training uses this fixed context (training_window(cfg)).
  context_steps: 15
  future_steps: 10
  modalities:
    - audio

prediction:
  # Latest states/actions kept before each rollout prediction; <= context_steps.
  rollout_context_size: 10
  # Every horizon of the experiment (future steps, each <= future_steps; 1 step
  # = 1 / data.grid_rate_hz s). Validation always evaluates all of them.
  rollout_horizons:
    - 1
    - 5
    - 10
  # Feed predictions back without gradient (truncated backprop).
  rollout_stop_gradient: true

  # Training horizons activated progressively over the optimizer steps. A
  # stage covers progress below `until`; stages are cumulative and the last
  # ends at 1.0. Disabled: every rollout_horizons from the first step.
  curriculum:
    enabled: true
    stages:
      - until: 0.20
        horizons:
          - 1
      - until: 0.50
        horizons:
          - 1
          - 5
      - until: 1.00
        horizons:
          - 1
          - 5
          - 10

loss:
  teacher_forcing:
    weight: 1.0
  rollout:
    weight: 1.0
    # One positive weight per prediction.rollout_horizons entry (keys are
    # strings). The rollout loss is their weighted mean over the active
    # horizons.
    horizon_weights:
      "1": 1.0
      "5": 1.0
      "10": 1.0
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

optimizer:
  type: AdamW
  lr: 1e-4
  weight_decay: 1e-3

scheduler:
  type: warmup_cosine
  # Stepped after every optimizer step (not per epoch).
  interval: step
  # Fraction of the run's optimizer steps (trainer.estimated_stepping_batches)
  # spent warming up linearly from min_lr to optimizer.lr.
  warmup_ratio: 0.05
  # LR at the first step and at the end of the cosine decay.
  min_lr: 1e-6

loader:
  batch_size: 128
  # A BatchNorm recipe can set this to true to avoid a final batch of one.
  drop_last: false
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

trainer:
  max_epochs: 100
  max_steps: 10000
  val_check_interval: 1000
  accelerator: gpu
  devices: auto
  # Mixed precision: parameters and SIGReg stay float32 under autocast.
  precision: bf16-mixed
  gradient_clip_val: 1.0

# Validation protocol (turn_wm.training.metrics). Keep the training-time
# surface deliberately small: rollout MSE, persistence baseline and one
# representation-collapse diagnostic.
evaluation:
  persistence_baseline: true
  effective_rank: true
  # Latents sampled per validation epoch (deterministically) for effective rank.
  latent_rank_samples: 8192

checkpoint:
  enabled: true
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true
  every_n_epochs: 1

  resume_from: null

experiment:
  name: lewm
  output_root: outputs

# TensorBoard (<run_dir>/tensorboard), <run_dir>/train.log and the profiler
# summary (<run_dir>/fit-profile.txt) are always written; W&B is optional.
logging:
  wandb:
    enabled: false
    project: turn-wm
    entity: null
    name: null
