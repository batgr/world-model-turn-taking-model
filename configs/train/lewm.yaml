# @package _global_
# Training recipe; its keys sit at the root of the composed config, next to
# `model` and `embed_dim` (see config.yaml). Read by turn_wm.training.lewm.

# Seeds Python, NumPy, PyTorch and data loader workers (training.train.run,
# before the model is built) and the data loader order.
seed: 3072

data:
  # A name in turn_wm.data.source.DATASETS: egocom (public), ego4d, full.
  dataset: full

  # Where audio observations come from:
  #   mimi_cache: precomputed Mimi features (turn-wm precompute-mimi) under
  #               mimi_cache.root; no raw audio, Mimi is never loaded.
  #   raw_audio:  decoded from local media (<DATASET>_MEDIA_ROOT) and encoded
  #               by frozen Mimi at every step; for debugging.
  # Both feed the same 512-d features to the same projector.
  observation_source: mimi_cache
  mimi_cache:
    # Required with observation_source: mimi_cache.
    root: null
  # Ground-truth context: the teacher forcing predicts z1..zC from z0..z(C-1).
  # Training uses this fixed context (training_window(cfg)).
  context_steps: 15
  future_steps: 10
  modalities:
    - audio

prediction:
  # Latest states/actions kept before each rollout prediction; <= context_steps.
  rollout_context_size: 10
  # Every horizon of the experiment (future steps, each <= future_steps; 1 step
  # = 100 ms). Validation always evaluates all of them.
  rollout_horizons:
    - 1
    - 5
    - 10
  # Feed predictions back without gradient (truncated backprop).
  rollout_stop_gradient: true

  # Training horizons activated progressively over the optimizer steps. A
  # stage covers progress below `until`; stages are cumulative and the last
  # ends at 1.0. Disabled: every rollout_horizons from the first step.
  curriculum:
    enabled: true
    stages:
      - until: 0.20
        horizons:
          - 1
      - until: 0.50
        horizons:
          - 1
          - 5
      - until: 1.00
        horizons:
          - 1
          - 5
          - 10

loss:
  teacher_forcing:
    weight: 1.0
  rollout:
    weight: 1.0
    # One positive weight per prediction.rollout_horizons entry (keys are
    # strings). The rollout loss is their weighted mean over the active
    # horizons.
    horizon_weights:
      "1": 1.0
      "5": 1.0
      "10": 1.0
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

optimizer:
  type: AdamW
  lr: 1e-4
  weight_decay: 1e-3

scheduler:
  type: warmup_cosine
  # Stepped after every optimizer step (not per epoch).
  interval: step
  # Fraction of the run's optimizer steps (trainer.estimated_stepping_batches)
  # spent warming up linearly from min_lr to optimizer.lr.
  warmup_ratio: 0.05
  # LR at the first step and at the end of the cosine decay.
  min_lr: 1e-6

loader:
  batch_size: 32
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: auto
  # Mixed precision: parameters and SIGReg stay float32 under autocast.
  precision: bf16-mixed
  gradient_clip_val: 1.0

# Validation diagnostics (turn_wm.training.metrics), computed each validation
# epoch from the tensors of the losses, over prediction.rollout_horizons.
evaluation:
  # MSE of copying the last latent, and skill = 1 - MSE_model / MSE_persistence.
  persistence_baseline: true
  cosine_similarity: true
  # latent_std, latent_norm, prediction_norm and effective_rank.
  latent_health: true
  # Latents sampled per validation epoch (deterministically) for the rank.
  latent_rank_samples: 8192

checkpoint:
  enabled: true
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true
  every_n_epochs: 1

  resume_from: null

experiment:
  name: lewm
  output_root: outputs

logging:
  wandb:
    enabled: false
    project: turn-wm
    entity: null
    name: null
