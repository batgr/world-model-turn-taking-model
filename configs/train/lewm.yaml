# @package _global_
# Training recipe; its keys sit at the root of the composed config, next to
# `model` and `embed_dim` (see config.yaml). Read by turn_wm.training.lewm.

# Seeds Python, NumPy, PyTorch and data loader workers (training.train.run,
# before the model is built) and the data loader order.
seed: 3072

data:
  # A name in turn_wm.data.source.DATASETS: egocom (public), ego4d, full.
  dataset: full
  # Ground-truth context: the teacher forcing predicts z1..zC from z0..z(C-1).
  # Training uses this fixed context (training_window(cfg)).
  context_steps: 15
  future_steps: 10
  modalities:
    - audio

prediction:
  # Latest states/actions kept before each rollout prediction; <= context_steps.
  rollout_context_size: 10
  # Future steps at which the rollout is supervised (each <= future_steps).
  rollout_horizons:
    - 1
    - 5
    - 10
  # Feed predictions back without gradient (truncated backprop).
  rollout_stop_gradient: true

loss:
  teacher_forcing:
    weight: 1.0
  rollout:
    weight: 1.0
    # One weight per prediction.rollout_horizons entry (keys are strings).
    horizon_weights:
      "1": 1.0
      "5": 1.0
      "10": 1.0
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

loader:
  batch_size: 32
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: auto
  # Mixed precision: parameters and SIGReg stay float32 under autocast.
  precision: bf16-mixed
  gradient_clip_val: 1.0

checkpoint:
  enabled: true
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true
  every_n_epochs: 1

  resume_from: null
