[project]
name = "world-model-turn-taking-models"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.32.0",
    "numpy>=2.5.3",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turn_wm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
