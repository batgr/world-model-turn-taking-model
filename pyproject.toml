[project]
name = "world-model-turn-taking-models"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "av>=18.1.0",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "httpx>=0.28.1",
    "huggingface-hub>=1.32.0",
    "hydra-core>=1.3.7",
    "lightning>=2.6.6",
    "numpy>=2.5.3",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "transformers>=5.17.0",
    "safetensors>=0.4",
    "tqdm>=4.66",
    # Official TurnBench gold, scorer and sweep (pinned in tool.uv.sources).
    "turnbench",
]

[project.scripts]
turn-wm = "turn_wm.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
turnbench = { git = "https://github.com/SesameAILabs/turnbench", rev = "76ccd045f121ccfa921abac2ad3107027e736911" }

[tool.uv]
# turnbench pins exact versions; allow this project's newer ones instead. Its
# gold/scoring code uses only stable APIs of these packages.
override-dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.32.0",
    "numpy>=2.5.3",
    "pyarrow>=24.0.0",
    "typer>=0.25.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/turn_wm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real-data tests download from the Hugging Face Hub; run them explicitly
# with `uv run pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: requires network access to the published Hugging Face datasets",
]
[project.optional-dependencies]
wandb = [
    "wandb",
]
analysis = [
    "matplotlib>=3.11.2",
]
